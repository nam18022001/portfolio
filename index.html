          <h2
            data-lang-en="About Me"

          <p
            data-lang-en="I graduated with a degree in Information Technology from the Vietnam-Korea University of Information and Communication Technology (VKU) – University of Danang. During my studies, I worked at OceanTech Da Nang, where I gained one year of experience working with JavaScript, TypeScript, ReactJS, and NodeJS. After graduating, I worked as a Full-Stack Engineer at AdsAgency for one year, further strengthening my expertise in web development, problem-solving, and system architecture.

            I’m passionate about building great products and always eager to learn new technologies. I enjoy tackling challenges, solving complex problems, and collaborating with teams to create efficient and scalable solutions. With my experience and ability to work under pressure, I believe I can bring value to your team and contribute to its success."
            data-lang-vn="Tôi tốt nghiệp chuyên ngành Công nghệ Thông tin tại Trường Đại học Công nghệ Thông tin và Truyền thông Việt - Hàn (VKU), Đại học Đà Nẵng. Trong thời gian học, tôi làm việc tại OceanTech Đà Nẵng và có một năm kinh nghiệm với JavaScript, TypeScript, ReactJS và NodeJS. Sau khi tốt nghiệp, tôi tiếp tục làm việc tại AdsAgency với vai trò Kỹ sư Full-Stack trong một năm, giúp tôi nâng cao kỹ năng phát triển web, tư duy giải quyết vấn đề và thiết kế hệ thống.

            Tôi đam mê xây dựng các sản phẩm chất lượng và luôn sẵn sàng học hỏi công nghệ mới. Tôi thích đối mặt với thử thách, giải quyết vấn đề phức tạp và làm việc cùng đội nhóm để tạo ra các giải pháp hiệu quả, có khả năng mở rộng. Với kinh nghiệm và khả năng làm việc dưới áp lực, tôi tin rằng mình có thể đóng góp giá trị cho đội ngũ của công ty."
            id="about-text"
          ></p>
